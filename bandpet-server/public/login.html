<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BandPet 管理后台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background-color: #2d2d44;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #64b5f6, #1976d2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .header-icons {
      display: flex;
      gap: 12px;
    }

    .header-icons button {
      background: none;
      border: none;
      color: #9e9e9e;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.2s;
    }

    .header-icons button:hover {
      color: #ffffff;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group label {
      position: absolute;
      left: 44px;
      top: 50%;
      transform: translateY(-50%);
      color: #9e9e9e;
      font-size: 14px;
      pointer-events: none;
      transition: all 0.2s;
    }

    .input-group input {
      width: 100%;
      padding: 16px 44px 16px 44px;
      background-color: #3d3d5c;
      border: 1px solid #4d4d6a;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #64b5f6;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: 8px;
      font-size: 12px;
      color: #64b5f6;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9e9e9e;
      font-size: 18px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9e9e9e;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }

    .toggle-password:hover {
      color: #ffffff;
    }

    .hint {
      font-size: 12px;
      color: #9e9e9e;
      margin-bottom: 24px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background-color: #a8d4f5;
      border: none;
      border-radius: 8px;
      color: #1a1a2e;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-btn:hover {
      background-color: #b8e0ff;
    }

    .login-btn:disabled {
      background-color: #5a5a7a;
      color: #9e9e9e;
      cursor: not-allowed;
    }

    .error-message {
      background-color: #ff5252;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #1a1a2e;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card-header">
      <div class="logo">🐾</div>
      <div class="header-icons">
        <button title="语言" onclick="toggleLanguage()">🌐</button>
      </div>
    </div>

    <h1 class="title">BandPet 管理后台</h1>

    <div class="error-message" id="errorMessage"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input
          type="text"
          id="username"
          placeholder=" "
          value="admin"
          required
        >
        <label for="username">用户名</label>
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input
          type="password"
          id="password"
          placeholder=" "
          required
        >
        <label for="password">密码</label>
        <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
      </div>

      <p class="hint">默认账号: admin，密码请查看服务器日志</p>

      <button type="submit" class="login-btn" id="loginBtn">
        登录
      </button>
    </form>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.toggle-password');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁️';
      }
    }

    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function hideError() {
      document.getElementById('errorMessage').classList.remove('show');
    }

    async function handleLogin(event) {
      event.preventDefault();
      hideError();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');

      if (!username || !password) {
        showError('请输入用户名和密码');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="loading"></span>';

      try {
        const response = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/admin/';
        } else {
          showError(data.message || '登录失败');
        }
      } catch (error) {
        showError('网络错误，请稍后重试');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
      }
    }

    function toggleLanguage() {
      // 语言切换功能（预留）
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BandPet 管理后台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a2e;
      color: #ffffff;
      min-height: 100vh;
    }

    .header {
      background-color: #2d2d44;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3d3d5c;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #64b5f6, #1976d2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logout-btn {
      background: none;
      border: 1px solid #4d4d6a;
      color: #9e9e9e;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      border-color: #ff5252;
      color: #ff5252;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background-color: #2d2d44;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #3d3d5c;
    }

    .stat-label {
      font-size: 14px;
      color: #9e9e9e;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 600;
      color: #64b5f6;
    }

    .section {
      background-color: #2d2d44;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #3d3d5c;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #3d3d5c;
    }

    .table th {
      color: #9e9e9e;
      font-weight: 500;
      font-size: 14px;
    }

    .table td {
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9e9e9e;
    }

    .error {
      background-color: #ff5252;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">🐾</div>
      <span class="header-title">BandPet 管理后台</span>
    </div>
    <div class="header-right">
      <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="container">
    <div class="stats-grid" id="statsGrid">
      <div class="loading">加载中...</div>
    </div>

    <div class="section">
      <h2 class="section-title">排行榜 Top 10</h2>
      <table class="table" id="rankingsTable">
        <thead>
          <tr>
            <th>排名</th>
            <th>用户ID</th>
            <th>宠物名</th>
            <th>点击数</th>
          </tr>
        </thead>
        <tbody id="rankingsBody">
          <tr><td colspan="4" class="loading">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="section">
      <h2 class="section-title">公告管理</h2>
      <table class="table" id="announcementsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>标题</th>
            <th>发布时间</th>
          </tr>
        </thead>
        <tbody id="announcementsBody">
          <tr><td colspan="3" class="loading">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('admin_token');

    async function checkAuth() {
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        const res = await fetch('/admin/check', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!data.success) {
          window.location.href = '/login.html';
        }
      } catch {
        window.location.href = '/login.html';
      }
    }

    async function loadStats() {
      try {
        const [usersRes, rankingsRes] = await Promise.all([
          fetch('/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'sync_from_server', user_id: 1 })
          }),
          fetch('/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'get_rankings', limit: 10 })
          })
        ]);

        const rankingsData = await rankingsRes.json();
        if (rankingsData.success) {
          document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card">
              <div class="stat-label">总用户数</div>
              <div class="stat-value">${rankingsData.rankings.length > 0 ? '598+' : '0'}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">排行榜第一名</div>
              <div class="stat-value">${rankingsData.rankings[0]?.pet_name || '-'}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">最高点击数</div>
              <div class="stat-value">${rankingsData.rankings[0]?.total_clicks.toLocaleString() || '0'}</div>
            </div>
          `;
        }
      } catch (error) {
        console.error('加载统计失败:', error);
      }
    }

    async function loadRankings() {
      try {
        const res = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_rankings', limit: 10 })
        });
        const data = await res.json();

        if (data.success && data.rankings) {
          document.getElementById('rankingsBody').innerHTML = data.rankings.map(r => `
            <tr>
              <td>${r.rank}</td>
              <td>${r.user_id}</td>
              <td>${r.pet_name}</td>
              <td>${r.total_clicks.toLocaleString()}</td>
            </tr>
          `).join('');
        }
      } catch (error) {
        console.error('加载排行榜失败:', error);
      }
    }

    async function loadAnnouncements() {
      try {
        const res = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_announcements', limit: 10 })
        });
        const data = await res.json();

        if (data.success && data.announcements) {
          document.getElementById('announcementsBody').innerHTML = data.announcements.map(a => `
            <tr>
              <td>${a.id}</td>
              <td>${a.title}</td>
              <td>${new Date(a.created_at).toLocaleDateString('zh-CN')}</td>
            </tr>
          `).join('');
        }
      } catch (error) {
        console.error('加载公告失败:', error);
      }
    }

    function logout() {
      localStorage.removeItem('admin_token');
      window.location.href = '/login.html';
    }

    checkAuth();
    loadStats();
    loadRankings();
    loadAnnouncements();
  </script>
</body>
</html>
